version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://irica:${DB_PASSWORD}@db:5432/irantradedb
    volumes:
      - ../data:/app/data        # persist downloaded Excel + Parquet files
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - trade

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: irica
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: irantradedb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irica -d irantradedb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - trade

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro        # place your cert.pem + key.pem here
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - trade

volumes:
  pgdata:

networks:
  trade:
    driver: bridge
